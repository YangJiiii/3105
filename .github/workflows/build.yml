name: Build IPA

on:
  push:
    branches: [tabbed, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 || true

      - name: Build (unsigned IPA)
        run: |
          set -euo pipefail
          DERIVED="$(pwd)/build/DerivedData"
          ARCHIVE="$(pwd)/build/3105.xcarchive"
          EXPORT="$(pwd)/build/export"
          mkdir -p "$DERIVED" "$EXPORT"

          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Archive did not produce an .app — checking DerivedData"
            APP_PATH=$(find "$DERIVED" -name "ThreeOneOSFive.app" -o -name "3105.app" | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find build -type d -name "*.app" 2>/dev/null | head -20 || true
            exit 1
          fi

          IPA_DIR="$(pwd)/build/ipa_payload"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (
            cd "$IPA_DIR"
            zip -r -y "../3105.ipa" Payload
          )
          ls -lh "$(pwd)/build/3105.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned
          path: build/3105.ipa
          if-no-files-found: error

      - name: Create draft release with IPA
        if: github.ref == 'refs/heads/tabbed' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (unsigned IPA)
          draft: true
          files: build/3105.ipa
          body: |
            Unsigned IPA from branch `${{ github.ref_name }}`.
            Sign with your enterprise certificate before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
