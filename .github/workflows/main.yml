name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App
        run: |
          # 1. Localiza o arquivo .xcodeproj
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Project found at: $PROJECT_PATH"
          
          # 2. Descobre AUTOMATICAMENTE qual é o scheme disponível
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | grep "Schemes:" -A 1 | tail -n 1 | sed 's/  //g' | sed 's/ / /g' | xargs)
          echo "Scheme detected as: $SCHEME_NAME"
          
          # 3. Executa o build ignorando a assinatura
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
            
            - name: Inject Patches into App Bundle
  run: |
    cp -R resources/patches/*.3105 build/Build/Products/Release-iphoneos/ExternalGH777.app/


      - name: Export IPA
        run: |
          # 1. Cria a pasta Payload
          mkdir -p Payload
          
          # 2. Localiza o app compilado
          APP_PATH=$(find ThreeOneOSFive.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          # 3. INJEÇÃO FORÇADA DE ARQUIVOS .3105
          # Localiza a pasta .app dentro de Payload
          APP_FOLDER=$(find Payload -name "*.app" | head -n 1)
          
          # Esse comando busca TODOS os arquivos .3105 no repositório e os copia para a RAIZ do app
          find . -name "*.3105" -exec cp {} "$APP_FOLDER/" \;
          
          echo "All .3105 files injected successfully into $APP_FOLDER"
          
          # 4. Zipa a pasta Payload e renomeia para .ipa
          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App-IPA
          path: ThreeOneOSFive.ipa
