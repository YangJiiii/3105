name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App
        run: |
          # Procura onde está o arquivo .xcodeproj e salva o caminho
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Project found at: $PROJECT_PATH"
          
          # Extrai apenas o nome do projeto para o scheme
          SCHEME_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            SKIP_INSTALL=NO

      - name: Export IPA
        run: |
          cd ThreeOneOSFive.xcarchive/Products/Applications
          # Pega o nome do app compilado automaticamente para zipar
          APP_NAME=$(ls -d *.app | head -n 1)
          zip -r ThreeOneOSFive.ipa "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App-IPA
          path: ThreeOneOSFive.xcarchive/Products/Applications/ThreeOneOSFive.ipa
