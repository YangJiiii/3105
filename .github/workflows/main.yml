name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Project found at: $PROJECT_PATH"
          
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | grep "Schemes:" -A 1 | tail -n 1 | sed 's/  //g' | sed 's/ / /g' | xargs)
          echo "Scheme detected as: $SCHEME_NAME"
          
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          cd ThreeOneOSFive.xcarchive/Products/Applications
          APP_NAME=$(ls -d *.app | head -n 1)
          zip -r ThreeOneOSFive.ipa "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App-IPA
          path: ThreeOneOSFive.xcarchive/Products/Applications/ThreeOneOSFive.ipa
