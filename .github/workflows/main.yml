name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive/ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            SKIP_INSTALL=NO

      - name: Export IPA
        run: |
          cd ThreeOneOSFive.xcarchive/Products/Applications
          zip -r ThreeOneOSFive.ipa ThreeOneOSFive.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App-IPA
          path: ThreeOneOSFive.xcarchive/Products/Applications/ThreeOneOSFive.ipa
